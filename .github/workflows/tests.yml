name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go.mod à jour
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum >/dev/null; then
            echo "::error file=go.mod::go.mod/go.sum ne sont pas à jour : lancez 'go mod tidy' et commitez le résultat"
            exit 1
          fi

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vet (linux, windows, darwin)
        run: |
          for os in linux windows darwin; do
            echo "== GOOS=$os"
            GOOS=$os go vet ./...
          done

      - name: Tests
        run: go test -race -v ./...
