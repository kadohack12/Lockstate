name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vet (linux, windows, darwin)
        run: |
          for os in linux windows darwin; do
            echo "== GOOS=$os"
            GOOS=$os go vet ./...
          done

      - name: Tests
        run: go test -race -v ./...
